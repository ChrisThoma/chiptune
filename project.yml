name: Chiptune
options:
  bundleIdPrefix: dev.individuation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Chiptune:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chiptune
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Dark launch screen matching Theme.background, so the app doesn't
        # flash white before the splash view takes over.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.individuation.chiptune
        CODE_SIGN_STYLE: Automatic
        # Signing team comes from the environment so it stays out of the repo.
        # Export CHIPTUNE_TEAM_ID before `xcodegen generate` and the value is
        # baked into the project; leave it unset and this expands to nothing,
        # which is the same as having no team — pick one in Xcode instead.
        DEVELOPMENT_TEAM: ${CHIPTUNE_TEAM_ID}
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
