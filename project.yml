name: Chiptune
options:
  bundleIdPrefix: dev.individuation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  Chiptune:
    build:
      targets:
        Chiptune: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChiptuneTests
      environmentVariables:
        # Tick this on in Xcode's scheme editor to rewrite
        # Tests/Fixtures/golden-demo.wav from the current synth. A unit test
        # bundle is hosted inside the app and takes its environment from the
        # scheme, so passing this on the xcodebuild command line does nothing —
        # it has to live here.
        - variable: CHIPTUNE_REGEN_GOLDEN
          value: "1"
          isEnabled: false
        # Thread Sanitizer kills the process on its first report. ChipCore is
        # deliberately lock-free and every one of its parameter writes is a
        # report, so the default behaviour meant the concurrency suite died on
        # the first `tempo` write — before a single XCTAssert ran, and before
        # any race after the first was ever looked for. `halt_on_error=0` makes
        # TSan print and carry on, so the tests actually finish and the CI job
        # sees every race rather than the earliest one.
        #
        # `abort_on_error=0` is the other half. It defaults on for Apple
        # platforms, and it is what turns TSan's exit into `abort()` — so
        # without it the run still ends in a SIGABRT crash report, just moved
        # from the first race to process teardown. The reports are expected
        # here; a crash log for each one is noise. TSan still exits non-zero,
        # which the CI job swallows on purpose and judges from the log instead.
        #
        # Same scheme-only rule as the variable above: on the xcodebuild
        # command line this does nothing.
        - variable: TSAN_OPTIONS
          value: "halt_on_error=0:abort_on_error=0"
          isEnabled: true
    archive:
      config: Release

targets:
  ChiptuneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Object form so Release/ can be excluded: release_test.sh is run by CI
      # from the checkout, never from the bundle. The directory sweep itself
      # stays broad on purpose - Tests/Fixtures/golden-demo.wav must keep
      # landing in the bundle for GoldenRenderTests.
      - path: Tests
        excludes:
          - Release
    dependencies:
      - target: Chiptune
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  Chiptune:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chiptune
        # The version has to be read out of the build settings rather than
        # written here. XcodeGen writes this plist itself, and with
        # GENERATE_INFOPLIST_FILE off the plist — not MARKETING_VERSION — is
        # what the archive carries. Left alone it gets XcodeGen's own defaults
        # of 1.0 and 1, so a version bump in the settings below does nothing
        # and the upload is refused as a duplicate of the build already on the
        # store. Nothing in the built app says which number won, which is why
        # this went unnoticed until the archive was read.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad turns freely. The editor has a stacked layout for tall windows
        # and a grid-beside-keyboard one for wide, so neither orientation is
        # the odd one out; the iPhone stays portrait because the stacked
        # layout has nowhere to put the keys in a 390pt-tall window.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dark launch screen matching Theme.background, so the app doesn't
        # flash white before the splash view takes over.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Nothing here encrypts anything. Declaring it up front skips the
        # export-compliance question on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        # An imported song is copied into the library and edited there; the
        # original file is only ever read. Saying so silences the build warning
        # and keeps Files from offering an in-place edit that never happens.
        LSSupportsOpeningDocumentsInPlace: false
        # A song file is the same JSON the library already stores, so the type
        # conforms to public.json — anything that can read text can read one,
        # and the app is only claiming the extension.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.individuation.chiptune.song
            UTTypeDescription: Chiptune Song
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [chipsong]
              public.mime-type: [application/json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Chiptune Song
            LSItemContentTypes: [dev.individuation.chiptune.song]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    postBuildScripts:
      # Stamp which commit this build came from, and when, into the built
      # Info.plist. The app shows both — see `BuildStamp`. A version number is
      # typed by hand and only changes when someone remembers, so it can't
      # answer "what went into this build"; the commit always can.
      #
      # It writes into the *built* plist under TARGET_BUILD_DIR, never into
      # Sources/Info.plist. That file is generated by XcodeGen, and a phase
      # that wrote into the repo would make every build a change to the
      # working tree.
      #
      # This is the last phase, and code signing happens after every phase,
      # so the edit lands before the bundle is sealed rather than breaking it.
      - name: Stamp the commit and build date into the built Info.plist
        # No inputs to compare against, so it has to be told to run every
        # time. A stamp refreshed only when something else changed is a stamp
        # that eventually names the wrong commit.
        basedOnDependencyAnalysis: false
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

          stamp () {  # stamp <key> <value>
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$plist"
          }

          # No git is not a build failure — a source tarball is a legitimate
          # way to build this. The app leaves the line out rather than showing
          # a placeholder, so nothing needs writing when there's no answer.
          commit=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null)
          if [ -n "$commit" ]; then
            stamp ChiptuneGitCommit "$commit"
          fi

          stamp ChiptuneBuildDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.individuation.chiptune
        CODE_SIGN_STYLE: Automatic
        # Signing team comes from the environment so it stays out of the repo.
        # Export CHIPTUNE_TEAM_ID before `xcodegen generate` and the value is
        # baked into the project; leave it unset and this expands to nothing,
        # which is the same as having no team — pick one in Xcode instead.
        DEVELOPMENT_TEAM: ${CHIPTUNE_TEAM_ID}
        # Stays at 1.0 until 1.0 is approved and on the store. The iPad work
        # bumped this to 1.1 on the reasoning that a layout is a feature
        # release — but nothing had shipped yet, so there was no released
        # version to move on from, and App Store Connect attached the 1.1
        # binary to the still-unsubmitted 1.0 version record. That mismatch
        # fails at submission, and an uploaded build can't be withdrawn, so
        # build 3 is stranded in a 1.1 train and 1.0 carries on at build 4.
        # Only raise the marketing version once a released one exists.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # iPhone and iPad. The iPad build is a native layout rather than the
        # scaled-up phone window it used to run in; see `ChipLayout`.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
